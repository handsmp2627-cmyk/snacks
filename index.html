<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>SMP Snacks – HAND</title>
<style>
  :root{--navy:#1f3864;--navy2:#2f5597;--bg:#f3f5f9;--card:#fff;--line:#dde2ea;--text:#1d2433;--muted:#6b7385;
        --amber:#fce5cd;--amberT:#9a5b00;--red:#f4cccc;--redT:#9c0006;--blue:#cfe2f3;--blueT:#1c4f80;--grey:#ededed;--yellow:#fff2cc;--green:#2e7d32}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
  header{background:var(--navy);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px}
  header .t{font-weight:700;font-size:16px;flex:1;min-width:0}
  header .s{font-size:12px;opacity:.8;font-weight:400;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:6px 10px;font-size:13px}
  main{max-width:720px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
  h2{font-size:17px;margin:0 0 10px}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  select,input,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid #c9cfda;border-radius:9px;background:#fff;color:var(--text)}
  input[type=number]{text-align:center;padding:10px 6px;font-variant-numeric:tabular-nums}
  input:disabled,select:disabled,textarea:disabled{background:#f2f3f6;color:#555}
  .btn{display:block;width:100%;border:0;border-radius:10px;padding:13px;font:600 15px/1 inherit;background:var(--navy);color:#fff;margin-top:14px;cursor:pointer}
  .btn.sec{background:#fff;color:var(--navy);border:1px solid var(--navy)}
  .btn:disabled{opacity:.5}
  .tiles{display:grid;gap:12px}
  .tile{background:#fff;border:1px solid var(--line);border-left:5px solid var(--navy2);border-radius:12px;padding:16px;cursor:pointer;text-align:left;font:inherit;width:100%}
  .tile b{display:block;font-size:17px;color:var(--navy);margin-bottom:4px}
  .tile span{color:var(--muted);font-size:13px}
  .err{background:var(--red);color:var(--redT);border-radius:9px;padding:10px 12px;margin-top:12px;font-size:14px;display:none}
  .ok{background:#e3f1e5;color:var(--green);border-radius:9px;padding:10px 12px;margin-top:12px;font-size:14px;display:none}
  .warn{background:var(--yellow);color:#7f6000;border-radius:9px;padding:10px 12px;margin-top:10px;font-size:13px}
  .info{background:#eef2f9;border-radius:9px;padding:10px 12px;font-size:13px;color:#2b3a55;margin-top:10px}
  .school{font-size:17px;font-weight:700;direction:auto}
  .meta{color:var(--muted);font-size:13px;margin-top:2px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chip{background:#eef2f9;border-radius:20px;padding:4px 10px;font-size:12px;color:#2b3a55}
  table.grid{width:100%;border-collapse:separate;border-spacing:0 6px}
  .grid th{font-size:12px;color:var(--muted);font-weight:600;text-align:center;padding:0 4px}
  .grid th:first-child{text-align:left}
  .grid td{padding:0 4px;vertical-align:middle}
  .grid td.day{font-weight:600;font-size:14px;white-space:nowrap;padding-left:0}
  .grid td.day small{display:block;font-weight:400;color:var(--muted);font-size:11px;white-space:normal;max-width:150px}
  .cell{position:relative}
  .cell input{min-width:70px}
  .cell.off input{background:var(--grey);color:#999}
  .cell.locked input{background:#f2f3f6}
  .cell.chg input{background:var(--amber);border-color:#e3b17a}
  .cell.ovr input{background:var(--blue);border-color:#8fb4d9}
  .cell.over input{background:var(--red);border-color:#e09a9a;color:var(--redT);font-weight:700}
  .cell .tag{font-size:10px;color:var(--muted);text-align:center;display:block;margin-top:2px;min-height:12px}
  .cell.over .tag{color:var(--redT)}
  .legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--muted);margin-top:8px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:4px;border:1px solid #ccc}
  .shift{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:12px}
  .shift h3{margin:0 0 6px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
  .shift h3 span{font-size:12px;font-weight:500;color:var(--muted)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .calc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .calc div{background:#f6f8fb;border-radius:8px;padding:8px;text-align:center}
  .calc b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
  .calc small{font-size:11px;color:var(--muted)}
  .calc .neg b{color:var(--redT)}
  table.hist{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px;font-variant-numeric:tabular-nums}
  .hist th,.hist td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:center}
  .hist th{color:var(--muted);font-weight:600;font-size:12px}
  .hidden{display:none!important}
  .spin{position:fixed;inset:0;background:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;z-index:20}
  .spin div{width:34px;height:34px;border:4px solid #c9d3e6;border-top-color:var(--navy);border-radius:50%;animation:r 0.8s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:#eef2f9;color:#2b3a55;margin-left:6px}
  .next{display:flex;gap:10px}
  .next .btn{margin-top:10px}
  @media (max-width:420px){ .cell input{min-width:58px} .grid td.day small{max-width:110px} }
</style>
</head>
<body>
<header>
  <div class="t">SMP Snacks · WFP.26<span class="s" id="hsub">HAND</span></div>
  <button id="btnBack" class="hidden" onclick="go('home')">Back</button>
  <button id="btnOut" class="hidden" onclick="signOut()">Sign out</button>
</header>
<main>

<!-- LOGIN -->
<section id="v-login">
  <div class="card">
    <h2>Sign in</h2>
    <label for="lUser">Your name</label>
    <select id="lUser"><option value="">Loading…</option></select>
    <label for="lPin">PIN</label>
    <input id="lPin" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="4-digit PIN">
    <label style="display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--text)"><input type="checkbox" id="lRem" checked style="width:auto"> Keep me signed in on this phone</label>
    <button class="btn" onclick="login()">Sign in</button>
    <div class="err" id="lErr"></div>
    <div class="info">Use the PIN on your personal slip. Do not share it – every entry is recorded under your name.</div>
  </div>
</section>

<!-- HOME -->
<section id="v-home" class="hidden">
  <div class="tiles">
    <button class="tile" onclick="go('plan')"><b>Weekly snack plan</b><span id="tPlan">Forecast per school, day and shift.</span></button>
    <button class="tile" onclick="go('daily')"><b>Daily distribution</b><span id="tDaily">Received, distributed and leftovers – every day.</span></button>
  </div>
  <div class="card" style="margin-top:14px">
    <h2>Rules</h2>
    <div class="meta" id="rules"></div>
  </div>
</section>

<!-- PLAN -->
<section id="v-plan" class="hidden">
  <div class="card">
    <h2>Weekly snack plan</h2>
    <label for="pWeek">Week (Monday – Sunday)</label>
    <select id="pWeek" onchange="loadPlanStatus()"></select>
    <label for="pSchool">School</label>
    <select id="pSchool" onchange="loadPlan()"></select>
  </div>
  <div id="pBody" class="hidden">
    <div class="card">
      <div class="school" id="pName"></div>
      <div class="meta" id="pMeta"></div>
      <div class="chips" id="pChips"></div>
      <div class="info" id="pLeft"></div>
    </div>
    <div class="card">
      <div id="pBanner"></div>
      <table class="grid" id="pGrid"></table>
      <div class="legend"><span><i style="background:var(--amber)"></i>Changed after cut-off</span><span><i style="background:var(--blue)"></i>Override</span><span><i style="background:var(--red)"></i>Above students</span><span><i style="background:var(--grey)"></i>Not a working day</span></div>
      <button class="btn sec" id="pFill" onclick="fillStudents()">Fill empty days with student numbers</button>
      <div id="pReasonBox" class="hidden">
        <label for="pReason">Reason for the change (required)</label>
        <select id="pReason"></select>
        <label for="pNote">Details</label>
        <input id="pNote" placeholder="e.g. exam day, attendance about 300">
      </div>
      <button class="btn" id="pSave" onclick="savePlan()">Save plan</button>
      <div class="err" id="pErr"></div>
      <div class="ok" id="pOk"></div>
      <div class="next hidden" id="pNext"><button class="btn sec" onclick="nextSchool('p')">Next school →</button></div>
    </div>
  </div>
</section>

<!-- DAILY -->
<section id="v-daily" class="hidden">
  <div class="card">
    <h2>Daily distribution</h2>
    <label for="dDate">Date</label>
    <select id="dDate" onchange="loadDailyStatus()"></select>
    <label for="dSchool">School</label>
    <select id="dSchool" onchange="loadDaily()"></select>
  </div>
  <div id="dBody" class="hidden">
    <div class="card">
      <div class="school" id="dName"></div>
      <div class="meta" id="dMeta"></div>
      <div class="chips" id="dChips"></div>
      <div id="dBanner"></div>
      <div id="dShifts"></div>
      <label for="dNotes">Notes (optional)</label>
      <textarea id="dNotes" rows="2" placeholder="e.g. 20 bags damaged on arrival, school trip"></textarea>
      <div id="dReasonBox" class="hidden">
        <label for="dReason">Reason for editing a closed day (required)</label>
        <select id="dReason"></select>
      </div>
      <button class="btn" id="dSave" onclick="saveDaily()">Save today's figures</button>
      <div class="err" id="dErr"></div>
      <div class="ok" id="dOk"></div>
      <div class="next hidden" id="dNext"><button class="btn sec" onclick="nextSchool('d')">Next school →</button></div>
    </div>
    <div class="card">
      <h2>Recent days</h2>
      <table class="hist" id="dHist"></table>
    </div>
  </div>
</section>
</main>
<div class="spin hidden" id="spin"><div></div></div>


<script>
/* ===== Only for the GitHub Pages copy: paste the Apps Script web app address (…/exec) here. Not needed inside Apps Script. ===== */
var API_URL = 'https://script.google.com/macros/s/AKfycbyzRf6yjLSRwU1wY_KvcIIGY4HPemhGU0xdFSLaAhjQvM7e6B465Zr75p-_eirpMhMo/exec';
/* ================================================================================================================================ */
var S = { user:null, uid:'', pin:'', schools:[], reasons:[], plan:null, daily:null, now:null };
function $(id){ return document.getElementById(id); }
function call(fn){
  var args = Array.prototype.slice.call(arguments,1);
  if(!(window.google && google.script && google.script.run)){
    // GitHub Pages mode: text/plain POST keeps it a simple request (no CORS preflight)
    return fetch(API_URL,{method:'POST',body:JSON.stringify({fn:fn,args:args}),redirect:'follow'})
      .then(function(r){ return r.json(); }, function(){ throw 'No connection – check your internet and try again.'; })
      .then(function(j){ if(j.error) throw j.error; return j.result; });
  }
  return new Promise(function(res,rej){
    var r = google.script.run.withSuccessHandler(res).withFailureHandler(function(e){ rej(e && e.message ? e.message.replace(/^Error:\s*/,'') : String(e)); });
    r[fn].apply(r,args);
  });
}
function busy(on){ $('spin').classList.toggle('hidden',!on); }
function show(el,msg){ el.textContent = msg||''; el.style.display = msg ? 'block':'none'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function store(k,v){ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(e){} }
function load(k){ try{ return localStorage.getItem(k);}catch(e){ return null; } }
var DN=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'], MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function addDays(ds,n){ var p=ds.split('-'); var d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2])+n*864e5); return d.toISOString().substr(0,10); }
function dLabel(ds){ var p=ds.split('-'); var d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2])); return DN[(d.getUTCDay()+6)%7]+' '+(+p[2])+' '+MN[+p[1]-1]; }

/* ---------- boot / login ---------- */
busy(true);
call('apiBoot').then(function(b){
  busy(false);
  $('hsub').textContent = 'HAND';
  var groups = {}; b.users.forEach(function(u){ (groups[u.role]=groups[u.role]||[]).push(u); });
  var order=['Area Monitor','Project Officer','Senior Project Officer','Project Manager','Viewer'];
  var h='<option value="">Select your name</option>';
  order.concat(Object.keys(groups).filter(function(k){return order.indexOf(k)<0;})).forEach(function(r){
    if(!groups[r]) return;
    h+='<optgroup label="'+esc(r)+'">'+groups[r].map(function(u){return '<option value="'+esc(u.id)+'">'+esc(u.name)+'</option>';}).join('')+'</optgroup>';
  });
  $('lUser').innerHTML=h;
  var qu=null; try{ qu=new URLSearchParams(location.search).get('u'); }catch(e){}
  var last=(qu||'').toUpperCase()||load('snk_uid'); if(last) $('lUser').value=last;
  var savedPin=load('snk_pin');
  if(savedPin && load('snk_uid') && (!qu || qu.toUpperCase()===load('snk_uid'))){ $('lUser').value=load('snk_uid'); $('lPin').value=savedPin; login(); }
}).catch(function(e){ busy(false); show($('lErr'),e); });

$('lPin').addEventListener('keydown',function(e){ if(e.key==='Enter') login(); });
function login(){
  var uid=$('lUser').value, pin=$('lPin').value.trim();
  if(!uid||!pin){ show($('lErr'),'Select your name and enter your PIN.'); return; }
  busy(true); show($('lErr'),'');
  call('apiLogin',uid,pin).then(function(r){
    busy(false);
    S.user=r.user; S.uid=uid; S.pin=pin; S.schools=r.schools; S.reasons=r.reasons; S.now=r.now; S.weeks=r.weeks; S.rules=r.rules;
    store('snk_uid',uid); store('snk_pin', $('lRem').checked ? pin : null);
    $('hsub').textContent = r.user.name+' · '+r.user.role;
    $('tPlan').textContent = 'Forecast per school, day and shift. Closes '+r.rules.planCutoff+' for the following week.';
    $('tDaily').textContent = 'Received, distributed and leftovers. Enter by '+r.rules.dailyCutoff+' every day.';
    $('rules').innerHTML =
      '• <b>Weekly plan</b> for next week closes <b>'+esc(r.rules.planCutoff)+'</b>.<br>'+
      '• After that, only <b>'+esc(r.rules.pickup2)+'</b> can still change, on <b>'+esc(r.rules.midWeek)+'</b>, with a reason.<br>'+
      '• <b>Daily figures</b> are entered the same day before <b>'+esc(r.rules.dailyCutoff)+'</b>. Past days are view only.<br>'+
      '• Leftovers carry to the next working day unless given out as double portions.'+
      (r.user.canOverride?'<br>• As '+esc(r.user.role)+' you can edit closed days. A reason is always recorded.':'');
    var opts=S.reasons.map(function(x){return '<option>'+esc(x)+'</option>';}).join('');
    $('pReason').innerHTML='<option value="">Select a reason</option>'+opts; $('dReason').innerHTML=$('pReason').innerHTML;
    $('lPin').value='';
    document.querySelectorAll('#v-home .tile').forEach(function(t,i){ if(i<2) t.classList.toggle('hidden',!r.user.canEnter && !S.schools.length); });
    if(!r.user.canEnter){ $('pSave').classList.add('hidden'); }
    go('home');
  }).catch(function(e){ busy(false); store('snk_pin',null); show($('lErr'),e); });
}
function signOut(){ S.user=null; S.pin=''; store('snk_pin',null); go('login'); }
function go(v){
  ['login','home','plan','daily'].forEach(function(x){ $('v-'+x).classList.toggle('hidden',x!==v); });
  $('btnBack').classList.toggle('hidden', v==='login'||v==='home');
  $('btnOut').classList.toggle('hidden', v==='login');
  if(v==='login') $('hsub').textContent='HAND';
  if(v==='plan') initPlan();
  if(v==='daily') initDaily();
  window.scrollTo(0,0);
}
function schoolOpts(sel, status, kind){
  var cur=sel.value;
  var h='<option value="">Select a school ('+S.schools.length+')</option>';
  S.schools.forEach(function(s){
    var st=status&&status[s.id], mark='';
    if(st){ var need=kind==='p'?st.planNeed:st.dailyNeed, have=kind==='p'?st.planHave:st.dailyHave;
      mark = need===0 ? '  ·  no shift' : have>=need ? '  ✓' : have>0 ? '  · '+have+'/'+need : '  · to do'; }
    h+='<option value="'+s.id+'">'+esc(s.name)+' – '+esc(s.village)+mark+'</option>';
  });
  sel.innerHTML=h; sel.value=cur;
}

/* ---------- weekly plan ---------- */
function initPlan(){
  var h=S.weeks.map(function(w){return '<option value="'+w.value+'">'+esc(w.label)+'</option>';}).join('');
  $('pWeek').innerHTML=h;
  var nxt=S.weeks.filter(function(w){return w.label.indexOf('Next week')===0;})[0];
  $('pWeek').value = nxt ? nxt.value : S.weeks[0].value;
  schoolOpts($('pSchool'),null,'p');
  $('pBody').classList.add('hidden');
  loadPlanStatus();
}
function loadPlanStatus(){
  call('apiStatus',S.uid,S.pin,$('pWeek').value,S.now.ds).then(function(st){ schoolOpts($('pSchool'),st,'p'); });
  if($('pSchool').value) loadPlan();
}
function loadPlan(){
  var sid=$('pSchool').value; show($('pErr'),''); show($('pOk'),''); $('pNext').classList.add('hidden');
  if(!sid){ $('pBody').classList.add('hidden'); return; }
  busy(true);
  call('apiGetPlan',S.uid,S.pin,sid,$('pWeek').value).then(function(r){ busy(false); S.plan=r; renderPlan(); })
    .catch(function(e){ busy(false); show($('pErr'),e); $('pBody').classList.remove('hidden'); });
}
function renderPlan(){
  var r=S.plan, s=r.school, hasPM=s.pm>0;
  $('pBody').classList.remove('hidden');
  $('pName').textContent=s.name;
  $('pMeta').textContent=s.village+' · '+s.area+' · Monitor: '+s.monitor;
  $('pChips').innerHTML='<span class="chip">AM students: <b>'+s.am+'</b></span>'+(hasPM?'<span class="chip">PM students: <b>'+s.pm+'</b></span>':'<span class="chip">No PM shift</span>')+
    '<span class="chip">AM days: '+esc(s.amDays||'–')+'</span>'+(hasPM?'<span class="chip">PM days: '+esc(s.pmDays||'–')+'</span>':'');
  $('pLeft').innerHTML='Leftover in the school store now: <b>AM '+r.leftover.AM+'</b>'+(hasPM?' · <b>PM '+r.leftover.PM+'</b>':'')+'. Take it into account when you plan.';
  var modes={}; r.days.forEach(function(d){ ['AM','PM'].forEach(function(sh){ if(d[sh].working||d[sh].qty!=null) modes[d[sh].mode]=d[sh].msg; }); });
  var b='';
  if(modes.open) b+='<div class="info">'+esc(modes.open)+'.</div>';
  if(modes.change) b+='<div class="warn">Change window: only the days still open below can change. A reason is required.</div>';
  if(modes.override) b+='<div class="warn">Some days are closed. As '+esc(S.user.role)+' you can override them – a reason is required.</div>';
  if(!modes.open&&!modes.change&&!modes.override) b+='<div class="info">This week is closed – view only.</div>';
  $('pBanner').innerHTML=b;
  var h='<tr><th>Day</th><th>AM</th>'+(hasPM?'<th>PM</th>':'')+'</tr>';
  r.days.forEach(function(d,i){
    var anyDay = d.AM.working || d.AM.qty!=null || (hasPM && (d.PM.working || d.PM.qty!=null));
    if(!anyDay && !S.user.canOverride) return;
    h+='<tr><td class="day">'+esc(d.label)+'<small>'+esc(d.menu||'')+'</small></td>'+cellHtml(d,'AM',i,s.am)+(hasPM?cellHtml(d,'PM',i,s.pm):'')+'</tr>';
  });
  $('pGrid').innerHTML=h;
  var anyEdit=r.days.some(function(d){return (d.AM.editable&&d.AM.working)||(hasPM&&d.PM.editable&&d.PM.working)||(S.user.canOverride&&(d.AM.editable||d.PM.editable));});
  $('pSave').disabled=!anyEdit; $('pFill').classList.toggle('hidden',!anyEdit);
  checkReason();
}
function cellHtml(d,sh,i,students){
  var c=d[sh], cls='cell', dis='', tag='';
  var canEdit = c.editable && (c.working || S.user.canOverride);
  if(!c.working){ cls+=' off'; tag='off'; }
  if(!canEdit){ cls+=' locked'; dis=' disabled'; if(c.working) tag='🔒 closed'; }
  if(c.status==='Changed') { cls+=' chg'; tag='changed'; }
  if(c.status==='Override') { cls+=' ovr'; tag='override'; }
  if(c.qty!=null && c.qty>students){ cls+=' over'; tag='above '+students; }
  var val=c.qty==null?'':c.qty;
  if(!c.working && c.qty==null && !canEdit) val='';
  return '<td><div class="'+cls+'" id="c_'+sh+'_'+i+'"><input type="number" inputmode="numeric" min="0" step="1" data-sh="'+sh+'" data-i="'+i+'" data-orig="'+val+'" value="'+val+'"'+dis+
    ' placeholder="'+(c.working?'':'–')+'" oninput="onPlanInput(this,'+students+')" title="'+esc(c.msg)+'"><span class="tag">'+esc(tag)+'</span></div></td>';
}
function onPlanInput(el,students){
  var box=el.parentNode, v=el.value===''?null:+el.value;
  box.classList.toggle('over', v!=null && v>students);
  box.querySelector('.tag').textContent = v!=null && v>students ? 'above '+students : (el.value!==el.dataset.orig?'edited':'');
  checkReason();
}
function changedInputs(){
  return Array.prototype.filter.call(document.querySelectorAll('#pGrid input:not([disabled])'),function(el){ return el.value!==el.dataset.orig; });
}
function checkReason(){
  var need=changedInputs().some(function(el){ var c=S.plan.days[+el.dataset.i][el.dataset.sh]; return c.mode==='change'||c.mode==='override'; });
  $('pReasonBox').classList.toggle('hidden',!need);
  return need;
}
function fillStudents(){
  var s=S.plan.school;
  document.querySelectorAll('#pGrid input:not([disabled])').forEach(function(el){
    var c=S.plan.days[+el.dataset.i][el.dataset.sh];
    if(el.value===''&&c.working){ el.value= el.dataset.sh==='AM'?s.am:s.pm; onPlanInput(el, el.dataset.sh==='AM'?s.am:s.pm); }
  });
}
function savePlan(){
  show($('pErr'),''); show($('pOk'),'');
  var ch=changedInputs();
  if(!ch.length){ show($('pErr'),'Nothing to save – no figures were changed.'); return; }
  var s=S.plan.school, over=[];
  var entries=ch.map(function(el){
    var d=S.plan.days[+el.dataset.i], v=el.value===''?null:+el.value, st=el.dataset.sh==='AM'?s.am:s.pm;
    if(v!=null&&v>st) over.push(el.dataset.sh+' '+d.label+' ('+v+' > '+st+')');
    return {ds:d.ds, shift:el.dataset.sh, qty:v};
  });
  if(entries.some(function(e){return e.qty===null;})){ show($('pErr'),'Use 0 for a day with no distribution – do not leave a saved figure empty.'); return; }
  var need=checkReason();
  if(need && !$('pReason').value){ show($('pErr'),'Select a reason for the change.'); return; }
  if(over.length && !confirm('These figures are above the number of students:\n'+over.join('\n')+'\n\nSave anyway?')) return;
  busy(true);
  call('apiSavePlan',S.uid,S.pin,s.id,S.plan.week,entries,need?$('pReason').value:'',$('pNote').value.trim()).then(function(r){
    busy(false); $('pNote').value=''; $('pReason').value='';
    show($('pOk'),'Saved '+r.saved+' figure(s)'+(r.flagged?' – marked as changed with your reason.':'.'));
    $('pNext').classList.remove('hidden');
    call('apiStatus',S.uid,S.pin,$('pWeek').value,S.now.ds).then(function(st){ schoolOpts($('pSchool'),st,'p'); });
    return call('apiGetPlan',S.uid,S.pin,s.id,S.plan.week).then(function(x){ S.plan=x; renderPlan(); show($('pOk'),'Saved '+r.saved+' figure(s)'+(r.flagged?' – marked as changed with your reason.':'.')); $('pNext').classList.remove('hidden'); });
  }).catch(function(e){ busy(false); show($('pErr'),e); });
}
function nextSchool(k){
  var sel=$(k==='p'?'pSchool':'dSchool'); var i=sel.selectedIndex;
  if(i<sel.options.length-1){ sel.selectedIndex=i+1; k==='p'?loadPlan():loadDaily(); window.scrollTo(0,0); }
}

/* ---------- daily ---------- */
function initDaily(){
  var h='', today=S.now.ds, back=S.user.canOverride?30:14;
  for(var i=0;i<=back;i++){ var d=addDays(today,-i); h+='<option value="'+d+'">'+(i===0?'Today · ':i===1?'Yesterday · ':'')+dLabel(d)+(i>0&&!S.user.canOverride?' (view)':'')+'</option>'; }
  $('dDate').innerHTML=h; $('dDate').value=today;
  schoolOpts($('dSchool'),null,'d');
  $('dBody').classList.add('hidden');
  loadDailyStatus();
}
function loadDailyStatus(){
  call('apiStatus',S.uid,S.pin,S.now.ds,$('dDate').value).then(function(st){ schoolOpts($('dSchool'),st,'d'); });
  if($('dSchool').value) loadDaily();
}
function loadDaily(){
  var sid=$('dSchool').value; show($('dErr'),''); show($('dOk'),''); $('dNext').classList.add('hidden');
  if(!sid){ $('dBody').classList.add('hidden'); return; }
  busy(true);
  call('apiGetDaily',S.uid,S.pin,sid,$('dDate').value).then(function(r){ busy(false); S.daily=r; renderDaily(); })
    .catch(function(e){ busy(false); show($('dErr'),e); });
}
function renderDaily(){
  var r=S.daily, s=r.school;
  $('dBody').classList.remove('hidden');
  $('dName').textContent=s.name;
  $('dMeta').textContent=r.label+' · '+s.village;
  $('dChips').innerHTML='<span class="chip">Menu: <b>'+esc(r.menu||'not set')+'</b></span>';
  var anyEdit=false, mode='';
  var h='';
  ['AM','PM'].forEach(function(sh){
    var x=r.shifts[sh];
    if(!x.exists) return;
    var ed=x.editable; if(ed){ anyEdit=true; mode=x.mode; }
    var dis=ed?'':' disabled';
    var rec = x.received!=null ? x.received : (ed && x.planned!=null ? x.planned : '');
    h+='<div class="shift" data-sh="'+sh+'"><h3>'+sh+' shift <span>'+x.students+' students'+(x.planned!=null?' · planned '+x.planned:' · no plan')+'</span></h3>';
    if(!x.working) h+='<div class="warn">'+esc(x.msg && !x.editable ? x.msg : 'Not a working day for this shift.')+'</div>';
    else if(!ed) h+='<div class="info">'+esc(x.msg)+(x.entered?'':' · nothing was entered')+'</div>';
    h+='<div class="row2"><div><label>Parcels received</label><input type="number" inputmode="numeric" min="0" data-f="received" value="'+rec+'"'+dis+' oninput="calc()"></div>'+
       '<div><label>Parcels distributed</label><input type="number" inputmode="numeric" min="0" data-f="distributed" value="'+(x.distributed==null?'':x.distributed)+'"'+dis+' oninput="calc()"></div>'+
       '<div><label>of which double portions</label><input type="number" inputmode="numeric" min="0" data-f="dbl" value="'+(x.dbl==null?'':x.dbl)+'"'+dis+' placeholder="0" oninput="calc()"></div>'+
       '<div><label>Damaged / returned</label><input type="number" inputmode="numeric" min="0" data-f="damaged" value="'+(x.damaged==null?'':x.damaged)+'"'+dis+' placeholder="0" oninput="calc()"></div></div>'+
       '<div class="calc"><div><small>Leftover from previous day</small><b>'+x.opening+'</b></div><div class="reach"><small>Students reached</small><b>–</b></div><div class="left"><small>Leftover after today</small><b>–</b></div></div>'+
       (x.history?'<div class="meta" style="margin-top:8px;white-space:pre-line">'+esc(x.history)+'</div>':'')+'</div>';
  });
  if(!h) h='<div class="info">No shift at this school on this day.</div>';
  $('dShifts').innerHTML=h;
  var anyNotes=['AM','PM'].map(function(k){return r.shifts[k].notes;}).filter(String)[0]||'';
  $('dNotes').value=anyNotes; $('dNotes').disabled=!anyEdit;
  $('dBanner').innerHTML = anyEdit ? (mode==='override'?'<div class="warn">This day is closed. You are editing as '+esc(S.user.role)+' – a reason is required.</div>':'<div class="info">Open until '+esc(S.rules.dailyCutoff)+' today.</div>') : '';
  $('dReasonBox').classList.toggle('hidden', !(anyEdit && mode==='override'));
  $('dSave').classList.toggle('hidden',!anyEdit);
  $('dSave').textContent = r.ds===S.now.ds ? "Save today's figures" : 'Save figures for '+dLabel(r.ds);
  calc();
  var t='<tr><th>Date</th><th>Shift</th><th>Rec</th><th>Dist</th><th>Double</th><th>Left</th></tr>';
  (r.recent||[]).forEach(function(x){ t+='<tr><td>'+dLabel(x.ds)+'</td><td>'+x.shift+'</td><td>'+x.rec+'</td><td>'+x.dist+'</td><td>'+(x.dbl||'')+'</td><td><b>'+x.close+'</b></td></tr>'; });
  if(!(r.recent||[]).length) t+='<tr><td colspan="6">No figures yet.</td></tr>';
  $('dHist').innerHTML=t;
}
function vals(box){ var o={}; box.querySelectorAll('input').forEach(function(el){ o[el.dataset.f]=el.value; }); return o; }
function calc(){
  document.querySelectorAll('#dShifts .shift').forEach(function(box){
    var x=S.daily.shifts[box.dataset.sh], v=vals(box);
    var rec=+v.received||0, dist=+v.distributed||0, dbl=+v.dbl||0, dmg=+v.damaged||0;
    var left=x.opening+rec-dist-dmg, reach=dist-dbl;
    var lb=box.querySelector('.left'), rb=box.querySelector('.reach');
    lb.querySelector('b').textContent = v.distributed===''?'–':left;
    lb.classList.toggle('neg', left<0);
    rb.querySelector('b').textContent = v.distributed===''?'–':reach;
    rb.classList.toggle('neg', reach>x.students);
  });
}
function saveDaily(){
  show($('dErr'),''); show($('dOk'),'');
  var r=S.daily, data={}, err='', warn=[];
  document.querySelectorAll('#dShifts .shift').forEach(function(box){
    var sh=box.dataset.sh, x=r.shifts[sh];
    if(!x.editable) return;
    var v=vals(box);
    if(v.distributed===''&&!x.entered) return; // shift not reported yet – can be saved later
    if(v.received===''||v.distributed===''){ err=sh+': enter both parcels received and distributed (use 0 if none).'; return; }
    var left=x.opening+(+v.received)-(+v.distributed)-(+v.damaged||0);
    if(left<0) err=sh+': distributed + damaged is more than what was available ('+(x.opening+(+v.received))+').';
    if((+v.dbl||0)>(+v.distributed)) err=sh+': double portions cannot be more than parcels distributed.';
    if((+v.distributed)-(+v.dbl||0)>x.students) warn.push(sh+': students reached is above enrolment ('+x.students+').');
    v.notes=$('dNotes').value.trim(); data[sh]=v;
  });
  if(err){ show($('dErr'),err); return; }
  if(!Object.keys(data).length){ show($('dErr'),'Enter the figures first.'); return; }
  var reason=$('dReason').value;
  if(!$('dReasonBox').classList.contains('hidden') && !reason){ show($('dErr'),'Select a reason.'); return; }
  if(warn.length && !confirm(warn.join('\n')+'\n\nSave anyway?')) return;
  busy(true);
  call('apiSaveDaily',S.uid,S.pin,r.school.id,r.ds,data,reason).then(function(res){
    busy(false);
    var msg='Saved.'+(res.warnings&&res.warnings.length?' Note: '+res.warnings.join(' '):'');
    call('apiStatus',S.uid,S.pin,S.now.ds,$('dDate').value).then(function(st){ schoolOpts($('dSchool'),st,'d'); });
    return call('apiGetDaily',S.uid,S.pin,r.school.id,r.ds).then(function(x){ S.daily=x; renderDaily(); show($('dOk'),msg); $('dNext').classList.remove('hidden'); });
  }).catch(function(e){ busy(false); show($('dErr'),e); });
}

</script>
</body>
</html>
